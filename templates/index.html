<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Whisper — Anonymous Rooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #0f0f13;
      --bg-elevated: #16161d;
      --bg-card: #1c1c26;
      --bg-input: #22222e;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.14);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --accent: #8b5cf6;
      --accent-soft: rgba(139, 92, 246, 0.18);
      --accent-hover: #a78bfa;
      --success: #34d399;
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.15);
      --radius: 16px;
      --radius-sm: 12px;
      --radius-xs: 8px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
    }

    /* ========== LOBBY ========== */
    #lobby {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      position: relative;
      overflow-y: auto;
    }

    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 18s ease-in-out infinite;
    }
    .orb-1 {
      width: 320px; height: 320px;
      background: #7c3aed;
      top: -80px; left: -80px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 280px; height: 280px;
      background: #2563eb;
      bottom: -60px; right: -60px;
      animation-delay: -6s;
    }
    .orb-3 {
      width: 200px; height: 200px;
      background: #db2777;
      top: 40%; left: 60%;
      animation-delay: -12s;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -40px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    .lobby-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(22, 22, 29, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: var(--shadow);
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .logo-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
    }
    .logo h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #f4f4f5, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }
    .input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .input::placeholder {
      color: var(--text-dim);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, box-shadow 0.2s, opacity 0.2s;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
      box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35);
      margin-bottom: 12px;
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #a78bfa, #8b5cf6);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.45);
    }
    .btn-secondary {
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover:not(:disabled) {
      background: #2a2a38;
      border-color: var(--border-strong);
    }
    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.25);
    }
    .btn-danger:hover:not(:disabled) {
      background: rgba(248, 113, 113, 0.25);
    }
    .btn-icon {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: var(--text-dim);
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .features {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .feature-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ========== CHAT VIEW ========== */
    #chat {
      display: none;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      max-height: 100dvh;
      position: relative;
      z-index: 1;
    }
    #chat.active {
      display: flex;
    }
    #lobby.hidden {
      display: none;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      padding-top: max(12px, var(--safe-top));
      background: rgba(22, 22, 29, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }
    .room-info {
      flex: 1;
      min-width: 0;
    }
    .room-code-display {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .room-code-display .copy-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      font-size: 0.85rem;
      transition: color 0.2s, background 0.2s;
    }
    .room-code-display .copy-btn:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }
    .room-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }
    .online-dot {
      width: 7px; height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .messages::-webkit-scrollbar {
      width: 5px;
    }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.12);
      border-radius: 4px;
    }

    .msg {
      max-width: 85%;
      animation: msgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .msg.own {
      align-self: flex-end;
    }
    .msg.other {
      align-self: flex-start;
    }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      position: relative;
      word-break: break-word;
    }
    .msg.own .msg-bubble {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      border-bottom-right-radius: 6px;
      color: white;
    }
    .msg.other .msg-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }
    .msg-nick {
      font-size: 0.72rem;
      font-weight: 600;
      margin-bottom: 3px;
      color: var(--accent-hover);
    }
    .msg.own .msg-nick {
      display: none;
    }
    .msg-text {
      font-size: 0.95rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .msg-img {
      max-width: 100%;
      max-height: 260px;
      border-radius: 12px;
      margin-top: 6px;
      display: block;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .msg-img:hover {
      transform: scale(1.02);
    }
    .msg-time {
      font-size: 0.68rem;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
      text-align: right;
    }
    .msg.other .msg-time {
      color: var(--text-dim);
    }

    /* Encoded message styles */
    .msg-encoded-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.68rem;
      font-weight: 600;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.12);
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .msg.own .msg-encoded-badge {
      color: #fde68a;
      background: rgba(253, 230, 138, 0.15);
    }
    .decrypt-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      padding: 5px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid rgba(139, 92, 246, 0.35);
      background: rgba(139, 92, 246, 0.12);
      color: var(--accent-hover);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .decrypt-btn:hover {
      background: rgba(139, 92, 246, 0.22);
    }
    .msg.own .decrypt-btn {
      border-color: rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.1);
      color: #e9d5ff;
    }
    .decrypt-panel {
      display: none;
      margin-top: 8px;
      gap: 6px;
      align-items: center;
    }
    .decrypt-panel.open {
      display: flex;
    }
    .decrypt-input {
      width: 70px;
      padding: 6px 8px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      outline: none;
      font-family: inherit;
    }
    .decrypt-input:focus {
      border-color: var(--accent);
    }
    .decrypt-apply {
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-family: inherit;
    }

    .system-msg {
      align-self: center;
      font-size: 0.78rem;
      color: var(--text-dim);
      padding: 6px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 999px;
      animation: msgIn 0.3s ease;
      margin: 4px 0;
    }

    .typing-indicator {
      padding: 0 16px 4px;
      font-size: 0.78rem;
      color: var(--text-dim);
      min-height: 20px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .typing-indicator.visible {
      opacity: 1;
    }

    /* Composer */
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px;
      padding-bottom: max(10px, calc(10px + var(--safe-bottom)));
      background: rgba(22, 22, 29, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .composer-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .image-preview {
      display: none;
      position: relative;
      align-self: flex-start;
      max-width: 120px;
    }
    .image-preview.active {
      display: block;
    }
    .image-preview img {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .image-preview .remove-img {
      position: absolute;
      top: -6px; right: -6px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--danger);
      color: white;
      border: none;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Encode row */
    .encode-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 2px;
    }
    .encode-label {
      font-size: 0.72rem;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .encode-input {
      width: 64px;
      padding: 6px 8px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .encode-input:focus {
      border-color: #fbbf24;
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.15);
    }
    .encode-input.has-code {
      border-color: #fbbf24;
      color: #fbbf24;
    }
    .encode-hint {
      font-size: 0.68rem;
      color: var(--text-dim);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .msg-input {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      padding: 12px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 22px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      resize: none;
      line-height: 1.4;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .msg-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .msg-input::placeholder {
      color: var(--text-dim);
    }
    .attach-btn, .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s, background 0.2s, opacity 0.2s;
    }
    .attach-btn {
      background: var(--bg-input);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .attach-btn:hover {
      background: #2a2a38;
      color: var(--text);
    }
    .send-btn {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
      box-shadow: 0 2px 12px rgba(139, 92, 246, 0.4);
    }
    .send-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #a78bfa, #8b5cf6);
    }
    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .attach-btn:active, .send-btn:active {
      transform: scale(0.92);
    }
    #file-input {
      display: none;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.875rem;
      box-shadow: var(--shadow);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      max-width: 90%;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 8px;
      object-fit: contain;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Connection status */
    .conn-status {
      position: fixed;
      top: max(12px, var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      color: var(--text-muted);
      z-index: 50;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .conn-status.show {
      opacity: 1;
    }
    .conn-status.reconnecting {
      color: #fbbf24;
    }
    .conn-status.error {
      color: var(--danger);
    }

    /* Mobile polish */
    @media (max-width: 480px) {
      .lobby-card {
        padding: 28px 22px;
        border-radius: 20px;
      }
      .msg {
        max-width: 90%;
      }
      .features {
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="conn-status" id="connStatus">Connecting…</div>
  <div class="toast" id="toast"></div>
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="Full size" />
  </div>

  <!-- LOBBY -->
  <div id="lobby">
    <div class="lobby-card">
      <div class="logo">
        <div class="logo-icon">💬</div>
        <h1>Whisper</h1>
      </div>
      <p class="tagline">Anonymous rooms. Nothing is stored.</p>

      <div class="form-group">
        <label for="nickname">Your name</label>
        <input class="input" id="nickname" type="text" placeholder="Anon" maxlength="24" autocomplete="off" />
      </div>

      <button class="btn btn-primary" id="btnCreate" onclick="createRoom()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Create Room
      </button>

      <div class="divider">or join with code</div>

      <div class="form-group">
        <label for="roomCode">Room code</label>
        <input class="input" id="roomCode" type="text" placeholder="e.g. XK9M2P" maxlength="8" autocomplete="off" style="text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600;" />
      </div>

      <button class="btn btn-secondary" id="btnJoin" onclick="joinRoom()">
        Join Room
      </button>

      <div class="features">
        <span class="feature-pill">🔒 No accounts</span>
        <span class="feature-pill">🗑️ Ephemeral</span>
        <span class="feature-pill">📷 Photos OK</span>
        <span class="feature-pill">🔐 Encode encode</span>
      </div>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chat">
    <header class="chat-header">
      <button class="btn btn-danger btn-icon" onclick="leaveRoom()" title="Leave room" aria-label="Leave room">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
      <div class="room-info">
        <div class="room-code-display">
          <span id="displayCode">------</span>
          <button class="copy-btn" onclick="copyCode()" title="Copy code">📋</button>
        </div>
        <div class="room-meta">
          <span class="online-dot"></span>
          <span id="userCount">1 online</span>
          <span>·</span>
          <span id="myNick">You</span>
        </div>
      </div>
    </header>

    <div class="messages" id="messages"></div>
    <div class="typing-indicator" id="typingIndicator"></div>

    <div class="composer">
      <div class="composer-inner">
        <div class="image-preview" id="imagePreview">
          <img id="previewImg" src="" alt="Preview" />
          <button class="remove-img" onclick="removeImage()" aria-label="Remove image">✕</button>
        </div>

        <!-- Encode code row -->
        <div class="encode-row">
          <span class="encode-label">Encode code</span>
          <input
            class="encode-input"
            id="encodeCode"
            type="text"
            maxlength="3"
            placeholder="ABC"
            autocomplete="off"
            spellcheck="false"
            title="3 letters. Leave empty for plain text."
          />
          <span class="encode-hint" id="encodeHint">optional · 3 letters</span>
        </div>

        <div class="input-row">
          <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Send photo" aria-label="Attach photo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </button>
          <textarea class="msg-input" id="msgInput" placeholder="Message…" rows="1" maxlength="2000"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled aria-label="Send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
      <input type="file" id="file-input" accept="image/*" />
    </div>
  </div>

  <script>
    const socket = io({
      transports: ["websocket", "polling"],
      reconnection: true,
      reconnectionAttempts: 15,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 8000,
    });

    let state = {
      roomCode: null,
      nickname: "Anon",
      pendingImage: null,
      typingTimeout: null,
      isTyping: false,
    };

    // DOM refs
    const lobby = document.getElementById("lobby");
    const chat = document.getElementById("chat");
    const messagesEl = document.getElementById("messages");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const nicknameInput = document.getElementById("nickname");
    const roomCodeInput = document.getElementById("roomCode");
    const encodeCodeInput = document.getElementById("encodeCode");
    const encodeHint = document.getElementById("encodeHint");
    const typingEl = document.getElementById("typingIndicator");
    const connStatus = document.getElementById("connStatus");
    const toastEl = document.getElementById("toast");

    // ---------- Encode / Decode helpers ----------
    /**
     * Encode: for each char in text, add ASCII of corresponding key char (cycles).
     * Example: text="hello", key="FGR"
     *   h+F, e+G, l+R, l+F, o+G
     */
    function encodeMessage(text, key) {
      if (!key || key.length === 0) return text;
      key = key.toUpperCase().slice(0, 3);
      let result = "";
      for (let i = 0; i < text.length; i++) {
        const tCode = text.charCodeAt(i);
        const kCode = key.charCodeAt(i % key.length);
        result += String.fromCharCode(tCode + kCode);
      }
      return result;
    }

    /**
     * Decode: subtract the same way.
     */
    function decodeMessage(encoded, key) {
      if (!key || key.length === 0) return encoded;
      key = key.toUpperCase().slice(0, 3);
      let result = "";
      for (let i = 0; i < encoded.length; i++) {
        const eCode = encoded.charCodeAt(i);
        const kCode = key.charCodeAt(i % key.length);
        result += String.fromCharCode(eCode - kCode);
      }
      return result;
    }

    // ---------- Helpers ----------
    function toast(msg, ms = 2400) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(() => toastEl.classList.remove("show"), ms);
    }

    function getNickname() {
      return (nicknameInput.value || "Anon").trim().slice(0, 24) || "Anon";
    }

    function getEncodeCode() {
      return (encodeCodeInput.value || "").trim().toUpperCase().replace(/[^A-Z]/g, "").slice(0, 3);
    }

    function formatTime(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      } catch {
        return "";
      }
    }

    function scrollToBottom(force = false) {
      const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;
      if (force || nearBottom) {
        requestAnimationFrame(() => {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        });
      }
    }

    function updateSendBtn() {
      const hasText = msgInput.value.trim().length > 0;
      const hasImg = !!state.pendingImage;
      sendBtn.disabled = !(hasText || hasImg) || !state.roomCode;
    }

    // ---------- Socket events ----------
    socket.on("connect", () => {
      connStatus.classList.remove("show", "reconnecting", "error");
      if (state.roomCode) {
        socket.emit("join_room", {
          room_code: state.roomCode,
          nickname: state.nickname,
        });
      }
    });

    socket.on("disconnect", () => {
      connStatus.textContent = "Disconnected";
      connStatus.classList.add("show", "error");
    });

    socket.on("reconnect_attempt", () => {
      connStatus.textContent = "Reconnecting…";
      connStatus.classList.add("show", "reconnecting");
      connStatus.classList.remove("error");
    });

    socket.on("reconnect", () => {
      connStatus.classList.remove("show", "reconnecting", "error");
      toast("Back online");
    });

    socket.on("error", (data) => {
      toast(data.message || "Something went wrong");
    });

    socket.on("room_joined", (data) => {
      state.roomCode = data.room_code;
      state.nickname = data.nickname;

      lobby.classList.add("hidden");
      chat.classList.add("active");

      document.getElementById("displayCode").textContent = data.room_code;
      document.getElementById("myNick").textContent = data.nickname;
      document.getElementById("userCount").textContent =
        data.user_count === 1 ? "1 online" : `${data.user_count} online`;

      messagesEl.innerHTML = "";
      if (data.messages && data.messages.length) {
        data.messages.forEach((m) => appendMessage(m, false));
      } else {
        appendSystem("Room is empty. Say hi!");
      }
      scrollToBottom(true);
      msgInput.focus();
    });

    socket.on("new_message", (msg) => {
      appendMessage(msg, true);
      scrollToBottom();
    });

    socket.on("user_joined", (data) => {
      appendSystem(`${data.nickname} joined`);
      document.getElementById("userCount").textContent =
        data.user_count === 1 ? "1 online" : `${data.user_count} online`;
      scrollToBottom();
    });

    socket.on("user_left", (data) => {
      appendSystem(`${data.nickname} left`);
      document.getElementById("userCount").textContent =
        data.user_count === 1 ? "1 online" : `${data.user_count} online`;
      scrollToBottom();
    });

    socket.on("user_typing", (data) => {
      if (data.is_typing) {
        typingEl.textContent = `${data.nickname} is typing…`;
        typingEl.classList.add("visible");
      } else {
        typingEl.classList.remove("visible");
      }
    });

    // ---------- UI actions ----------
    function createRoom() {
      const nick = getNickname();
      state.nickname = nick;
      document.getElementById("btnCreate").disabled = true;
      socket.emit("create_room", { nickname: nick });
      setTimeout(() => (document.getElementById("btnCreate").disabled = false), 1500);
    }

    function joinRoom() {
      const code = (roomCodeInput.value || "").trim().toUpperCase();
      if (!code) {
        toast("Enter a room code");
        roomCodeInput.focus();
        return;
      }
      const nick = getNickname();
      state.nickname = nick;
      document.getElementById("btnJoin").disabled = true;
      socket.emit("join_room", { room_code: code, nickname: nick });
      setTimeout(() => (document.getElementById("btnJoin").disabled = false), 1500);
    }

    function leaveRoom() {
      if (state.roomCode) {
        socket.emit("leave_room", { room_code: state.roomCode });
      }
      state.roomCode = null;
      state.pendingImage = null;
      removeImage();
      chat.classList.remove("active");
      lobby.classList.remove("hidden");
      messagesEl.innerHTML = "";
      msgInput.value = "";
      encodeCodeInput.value = "";
      encodeCodeInput.classList.remove("has-code");
      encodeHint.textContent = "optional · 3 letters";
      updateSendBtn();
      typingEl.classList.remove("visible");
    }

    function sendMessage() {
      if (!state.roomCode) return;
      let text = msgInput.value.trim();
      if (!text && !state.pendingImage) return;

      const code = getEncodeCode();
      let isEncoded = false;

      // Encode text if a 3-letter code is provided
      if (text && code.length === 3) {
        text = encodeMessage(text, code);
        isEncoded = true;
      } else if (text && code.length > 0 && code.length < 3) {
        toast("Encode code must be exactly 3 letters");
        encodeCodeInput.focus();
        return;
      }

      socket.emit("send_message", {
        room_code: state.roomCode,
        nickname: state.nickname,
        text: text,
        image: state.pendingImage,
        encoded: isEncoded,   // flag so receivers know it's encoded
      });

      msgInput.value = "";
      msgInput.style.height = "auto";
      // Keep the encode code so user can keep using the same key
      removeImage();
      updateSendBtn();
      stopTyping();
    }

    function appendMessage(msg, animate) {
      const isOwn = msg.sid === socket.id || msg.nickname === state.nickname;
      const div = document.createElement("div");
      div.className = `msg ${isOwn ? "own" : "other"}`;
      if (!animate) div.style.animation = "none";

      const msgId = "msg-" + Math.random().toString(36).slice(2, 10);
      div.dataset.msgId = msgId;

      let html = `<div class="msg-bubble">`;

      if (!isOwn) {
        html += `<div class="msg-nick">${escapeHtml(msg.nickname)}</div>`;
      }

      // Show encoded badge if the message was sent encoded
      if (msg.encoded && msg.text) {
        html += `<div class="msg-encoded-badge">🔐 Encoded</div>`;
      }

      if (msg.text) {
        html += `<div class="msg-text" id="text-${msgId}">${escapeHtml(msg.text)}</div>`;
      }

      if (msg.image) {
        html += `<img class="msg-img" src="${msg.image}" alt="Shared photo" loading="lazy" onclick="openLightbox(this.src)" />`;
      }

      // Decrypt controls (only for encoded text messages)
      if (msg.encoded && msg.text) {
        html += `
          <button class="decrypt-btn" onclick="toggleDecrypt('${msgId}')">
            🔓 Unlock
          </button>
          <div class="decrypt-panel" id="panel-${msgId}">
            <input class="decrypt-input" id="key-${msgId}" maxlength="3" placeholder="CODE" autocomplete="off" spellcheck="false" />
            <button class="decrypt-apply" onclick="applyDecrypt('${msgId}', ${JSON.stringify(msg.text)})">Apply</button>
          </div>
        `;
      }

      html += `<div class="msg-time">${formatTime(msg.timestamp)}</div></div>`;
      div.innerHTML = html;
      messagesEl.appendChild(div);
    }

    function toggleDecrypt(msgId) {
      const panel = document.getElementById("panel-" + msgId);
      if (!panel) return;
      panel.classList.toggle("open");
      if (panel.classList.contains("open")) {
        const input = document.getElementById("key-" + msgId);
        if (input) input.focus();
      }
    }

    function applyDecrypt(msgId, encodedText) {
      const input = document.getElementById("key-" + msgId);
      if (!input) return;
      const key = (input.value || "").trim().toUpperCase().replace(/[^A-Z]/g, "").slice(0, 3);

      if (key.length !== 3) {
        toast("Enter exactly 3 letters");
        input.focus();
        return;
      }

      const decoded = decodeMessage(encodedText, key);
      const textEl = document.getElementById("text-" + msgId);
      if (textEl) {
        textEl.textContent = decoded;
        textEl.style.color = "#34d399"; // green to show it was unlocked
      }

      // Hide the panel and change badge
      const panel = document.getElementById("panel-" + msgId);
      if (panel) panel.classList.remove("open");

      const bubble = textEl?.closest(".msg-bubble");
      const badge = bubble?.querySelector(".msg-encoded-badge");
      if (badge) {
        badge.textContent = "✅ Unlocked";
        badge.style.color = "#34d399";
        badge.style.background = "rgba(52, 211, 153, 0.12)";
      }

      // Hide unlock button
      const btn = bubble?.querySelector(".decrypt-btn");
      if (btn) btn.style.display = "none";

      toast("Message unlocked");
    }

    function appendSystem(text) {
      const div = document.createElement("div");
      div.className = "system-msg";
      div.textContent = text;
      messagesEl.appendChild(div);
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    function copyCode() {
      if (!state.roomCode) return;
      navigator.clipboard.writeText(state.roomCode).then(() => toast("Code copied!")).catch(() => {
        toast(state.roomCode);
      });
    }

    // Image handling
    document.getElementById("file-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        toast("Only images are allowed");
        return;
      }
      if (file.size > 1.5 * 1024 * 1024) {
        toast("Image max ~1.5 MB");
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        state.pendingImage = ev.target.result;
        document.getElementById("previewImg").src = state.pendingImage;
        document.getElementById("imagePreview").classList.add("active");
        updateSendBtn();
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    });

    function removeImage() {
      state.pendingImage = null;
      document.getElementById("imagePreview").classList.remove("active");
      document.getElementById("previewImg").src = "";
      updateSendBtn();
    }

    function openLightbox(src) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightbox").classList.add("active");
    }
    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
    }

    // Typing indicator
    function notifyTyping(isTyping) {
      if (!state.roomCode) return;
      if (state.isTyping === isTyping) return;
      state.isTyping = isTyping;
      socket.emit("typing", {
        room_code: state.roomCode,
        nickname: state.nickname,
        is_typing: isTyping,
      });
    }
    function stopTyping() {
      clearTimeout(state.typingTimeout);
      notifyTyping(false);
    }

    msgInput.addEventListener("input", () => {
      msgInput.style.height = "auto";
      msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + "px";
      updateSendBtn();
      notifyTyping(true);
      clearTimeout(state.typingTimeout);
      state.typingTimeout = setTimeout(stopTyping, 1800);
    });

    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Encode code input feedback
    encodeCodeInput.addEventListener("input", () => {
      const val = getEncodeCode();
      encodeCodeInput.value = val;
      if (val.length === 3) {
        encodeCodeInput.classList.add("has-code");
        encodeHint.textContent = "🔒 will encode";
        encodeHint.style.color = "#fbbf24";
      } else if (val.length > 0) {
        encodeCodeInput.classList.remove("has-code");
        encodeHint.textContent = `${3 - val.length} more…`;
        encodeHint.style.color = "var(--text-dim)";
      } else {
        encodeCodeInput.classList.remove("has-code");
        encodeHint.textContent = "optional · 3 letters";
        encodeHint.style.color = "var(--text-dim)";
      }
    });

    // Lobby keyboard
    roomCodeInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") joinRoom();
    });
    nicknameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        if (roomCodeInput.value.trim()) joinRoom();
        else createRoom();
      }
    });

    // Prevent zoom on double-tap iOS
    let lastTouch = 0;
    document.addEventListener("touchend", (e) => {
      const now = Date.now();
      if (now - lastTouch <= 300) e.preventDefault();
      lastTouch = now;
    }, { passive: false });
  </script>
</body>
</html>
